{% load static %}

<section class="card flex-row mb-4">
    <div class="d-flex flex-column gap-2">
        {% if question.author.avatar %}
            <img src="{{ question.author.avatar.url }}" class="card-img-top avatar-img" alt="avatar">
        {% else %}
            <img src="{% static 'questions/img/default-avatar.png' %}" class="card-img-top avatar-img" alt="avatar">
        {% endif %}
            <div class="vote d-flex flex-column align-items-center" data-vote="question-{{ question.pk }}">
                <button class="btn btn-sm btn-outline-success mb-1 up{% if question.user_value == 1 %} active{% endif %}"
                        data-rate="question" data-id="{{ question.pk }}" data-value="1">↑</button>

                <span data-rating-for="question-{{ question.pk }}">{{ question.rating }}</span>

                <button class="btn btn-sm btn-outline-danger mt-1 down{% if question.user_value == -1 %} active{% endif %}"
                        data-rate="question" data-id="{{ question.pk }}" data-value="-1">↓</button>
            </div>
    </div>
    <div class="card-body">
        <h4 class="card-title">
            <a href="{{ question.get_absolute_url }}">{{ question.title }}</a>
        </h4>
        <p class="card-text">{{ question.description }}</p>
        <div class="card-bottom d-flex justify-content-between align-items-center">
            <a href="{{ question.get_absolute_url }}">
                answer({{ question.ans_count }})
            </a>
            <div class="card-tags d-flex gap-2 align-items-center">
                Tags:
                {% for qt in question.questiontag.all %}
                    <a href="{% url 'tag' qt.tag.slug %}">{{ qt.tag.name }}</a>
                {% endfor %}
            </div>
        </div>
    </div>
</section>
