{% load static %}
<section class="card flex-row mb-4">
    <div class="d-flex flex-column gap-2">
        {% if answer.author.avatar %}
            <img src="{{ answer.author.avatar.url }}" class="card-img-top avatar-img" alt="avatar">
        {% else %}
            <img src="{% static 'questions/img/default-avatar.png' %}" class="card-img-top avatar-img" alt="avatar">
        {% endif %}
        <div class="vote d-flex flex-column align-items-center" data-vote="answer-{{ answer.pk }}">
            <button class="btn btn-sm btn-outline-success mb-1 up{% if answer.user_value == 1 %} active{% endif %}"
                    data-rate="answer" data-id="{{ answer.pk }}" data-value="1">↑</button>
            <span data-rating-for="answer-{{ answer.pk }}">{{ answer.rating }}</span>
            <button class="btn btn-sm btn-outline-danger mt-1 down{% if answer.user_value == -1 %} active{% endif %}"
                    data-rate="answer" data-id="{{ answer.pk }}" data-value="-1">↓</button>
        </div>
    </div>
    <div class="card-body">
        <p class="card-text">{{ answer.description }}</p>
        <div class="card-bottom d-flex justify-content-between align-items-center">
            
            {% if request.user.is_authenticated and request.user == question.author.user %}
                <div class="form-field">
                    <input type="checkbox" 
                        id="checkLabel-{{ answer.id }}" 
                        class="check js-mark-correct" 
                        data-question-id="{{ question.id }}" 
                        data-answer-id="{{ answer.id }}"
                        {% if answer.is_correct %}checked{% endif %} />
                    <label for="checkLabel-{{ answer.id }}">Correct!</label>
                </div>
            {% elif answer.is_correct %}
                <span class="badge bg-success">✓ Correct!</span>
            {% endif %}

        </div>
    </div>
</section>
