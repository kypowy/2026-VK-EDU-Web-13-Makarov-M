{% extends "questions/layout/base.html" %}
{% load static %}

{% block content %}
<main class="col-12 col-lg-8 col-xl-9 flex-column d-flex">
    <div class="card">
        <h2 class="mb-3">Log in</h2>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                <input type="text"
                       name="username"
                       id="id_username"
                       class="form-control"
                       autocomplete="username"
                       required
                       autofocus>
            </div>

            <div class="mb-3">
                <label for="id_password" class="form-label">Password</label>
                <input type="password"
                       name="password"
                       id="id_password"
                       class="form-control"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>

        <p class="mt-3 mb-0">
            Don't have an account?
            <a href="{% url 'signup' %}">Sign up</a>
        </p>
    </div>
</main>
{% endblock %}
