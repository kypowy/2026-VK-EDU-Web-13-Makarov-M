{% extends "questions/layout/base.html" %}
{% load static %}
{% load django_bootstrap5 %}
{% block content%}
<main class="col-12 col-lg-8 col-xl-9 flex-column d-flex">
    <div class="title">
                            <h2>New Question</h2>
                        </div>
                        <div class="question-form">
                            <form method="POST">
                                {% csrf_token %}
                                {% bootstrap_form form %}
                                {% bootstrap_button button_type="submit" content="Ask!" %}

                            </form>
                        </div>

</main>
{% endblock %}
