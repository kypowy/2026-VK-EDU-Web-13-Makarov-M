{% extends "questions/layout/base.html" %}
{% load static %}

{% block content %}
<main class="col-12 col-lg-8 col-xl-9 flex-column d-flex">
    <div class="card">
        <h2 class="mb-3">Sign up</h2>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                <input type="text"
                       name="username"
                       id="id_username"
                       class="form-control"
                       autocomplete="username"
                       required
                       autofocus>
            </div>

            <div class="mb-3">
                <label for="id_email" class="form-label">Email</label>
                <input type="email"
                       name="email"
                       id="id_email"
                       class="form-control"
                       autocomplete="email"
                       required>
            </div>

            <div class="mb-3">
                <label for="id_password1" class="form-label">Password</label>
                <input type="password"
                       name="password1"
                       id="id_password1"
                       class="form-control"
                       autocomplete="new-password"
                       required>
            </div>

            <div class="mb-3">
                <label for="id_password2" class="form-label">Confirm password</label>
                <input type="password"
                       name="password2"
                       id="id_password2"
                       class="form-control"
                       autocomplete="new-password"
                       required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Sign up</button>
        </form>

        <p class="mt-3 mb-0">
            Already have an account?
            <a href="{% url 'login' %}">Log in</a>
        </p>
    </div>
</main>
{% endblock %}
