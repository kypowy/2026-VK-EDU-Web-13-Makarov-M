{% extends "questions/layout/base.html" %}
{% load static %}
{% load django_bootstrap5 %}
{% block content %}
<main class="col-12 col-lg-8 col-xl-9 flex-column d-flex">
    <div class="card">
        <h2 class="mb-3">Sign up</h2>

        <form method="POST" action = "">
        {% csrf_token %}

        {% bootstrap_form form %}
        {% bootstrap_button button_type="submit" content="Register" %}
        </form>

        <p class="mt-3 mb-0">
            Already have an account?
            <a href="{% url 'login' %}">Log in</a>
        </p>
    </div>
</main>
{% endblock %}
