{% extends "questions/layout/base.html" %}
{% load static %}
{% load django_bootstrap5 %}

{% block content %}
<main class="col-12 col-lg-8 col-xl-9 flex-column d-flex">
    <div class="card">
        <h2 class="mb-3">Log in</h2>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}
            {% bootstrap_form form %}
            {% bootstrap_button button_type="submit" content="Login" %}

        </form>

        <p class="mt-3 mb-0">
            Don't have an account?
            <a href="{% url 'signup' %}">Sign up</a>
        </p>
    </div>
</main>
{% endblock %}
